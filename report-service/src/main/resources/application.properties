spring.application.name=report-service
server.port=8086

# This service keeps NO data of its own - it reports live from the hazard services.
# A database would only create a stale copy; fetching on demand means every
# report is always up to date. (Explain this trade-off if the teacher asks!)

# Where the hazard services live (approved feeds)
hazard.flood.url=http://localhost:8081
hazard.drought.url=http://localhost:8082
hazard.fire.url=http://localhost:8083
hazard.zoonotic.url=http://localhost:8084
hazard.mining.url=http://localhost:8085
