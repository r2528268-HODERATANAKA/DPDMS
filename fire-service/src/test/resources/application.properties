# Test-only configuration.
# Unit tests are pure Mockito (no Spring context). The one @SpringBootTest (contextLoads)
# uses this file instead of the main application.properties so it runs against
# in-memory H2 - this way `mvn test` works on any laptop without installing MySQL.
spring.application.name=fire-service
server.port=0

spring.datasource.url=jdbc:h2:mem:fire_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# notifications off during tests
alert.service.url=
