spring.application.name=auth-service
server.port=8100

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:dpdms_auth}?createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASS:Gr@nd$0n}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- JWT signing (HS256). Must be >= 32 characters and identical in every service.
dpdms.jwt.secret=${JWT_SECRET:dpdms-dev-secret-change-me-0123456789abcdef0123456789abcdef}
dpdms.jwt.expiration-minutes=720
