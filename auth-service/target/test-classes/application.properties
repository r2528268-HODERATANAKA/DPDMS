# Test-only configuration.
# The @SpringBootTest (contextLoads) runs against in-memory H2 so `mvn test`
# works on any laptop without installing MySQL.
spring.application.name=auth-service
server.port=0

spring.datasource.url=jdbc:h2:mem:auth_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

dpdms.jwt.secret=dpdms-test-secret-key-which-is-long-enough-0123456789abcdef
dpdms.jwt.expiration-minutes=480
