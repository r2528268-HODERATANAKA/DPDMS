spring.application.name=api-gateway
server.port=8888

# Eureka: registry location (informational here; routes below are static to the compose service names)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Same secret as auth-service (must always match!)
dpdms.jwt.secret=dpdms-dev-secret-change-me-before-production-0123456789abcdef

# ---------- Routes: /api/<prefix>/** -> the owning service ----------
# NOTE: Spring Cloud Gateway 5 (Spring Cloud 2025.1.1) reads routes from
# "spring.cloud.gateway.server.webflux.routes" (the old "spring.cloud.gateway.routes"
# prefix is not bound any more). URIs are the docker-compose service names.
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://auth-service:8080
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=flood-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://flood-service:8081
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/floods/**

spring.cloud.gateway.server.webflux.routes[2].id=drought-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://drought-service:8082
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/droughts/**

spring.cloud.gateway.server.webflux.routes[3].id=fire-service
spring.cloud.gateway.server.webflux.routes[3].uri=http://fire-service:8083
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/fires/**

spring.cloud.gateway.server.webflux.routes[4].id=zoonotic-disease-service
spring.cloud.gateway.server.webflux.routes[4].uri=http://zoonotic-disease-service:8084
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/zoonotics/**

spring.cloud.gateway.server.webflux.routes[5].id=mining-accident-service
spring.cloud.gateway.server.webflux.routes[5].uri=http://mining-accident-service:8085
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/minings/**

spring.cloud.gateway.server.webflux.routes[6].id=report-service
spring.cloud.gateway.server.webflux.routes[6].uri=http://report-service:8086
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/reports/**

spring.cloud.gateway.server.webflux.routes[7].id=alert-service
spring.cloud.gateway.server.webflux.routes[7].uri=http://alert-service:8087
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/alerts/**

spring.cloud.gateway.server.webflux.routes[8].id=dashboard-service
spring.cloud.gateway.server.webflux.routes[8].uri=http://dashboard-service:8088
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/api/dashboard/**
