spring.application.name=api-gateway
server.port=8888

# Eureka: where the registry lives (in Docker this is overridden to http://discovery:8761/eureka)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Same secret as auth-service (must always match!)
dpdms.jwt.secret=dpdms-dev-secret-change-me-before-production-0123456789abcdef

# ---------- Routes: /api/<prefix>/** -> the owning service (resolved via Eureka) ----------

spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.routes[1].id=flood-service
spring.cloud.gateway.routes[1].uri=lb://flood-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/floods/**

spring.cloud.gateway.routes[2].id=drought-service
spring.cloud.gateway.routes[2].uri=lb://drought-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/droughts/**

spring.cloud.gateway.routes[3].id=fire-service
spring.cloud.gateway.routes[3].uri=lb://fire-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/fires/**

spring.cloud.gateway.routes[4].id=zoonotic-disease-service
spring.cloud.gateway.routes[4].uri=lb://zoonotic-disease-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/zoonotics/**

spring.cloud.gateway.routes[5].id=mining-accident-service
spring.cloud.gateway.routes[5].uri=lb://mining-accident-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/minings/**

spring.cloud.gateway.routes[6].id=report-service
spring.cloud.gateway.routes[6].uri=lb://report-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/reports/**

spring.cloud.gateway.routes[7].id=alert-service
spring.cloud.gateway.routes[7].uri=lb://alert-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/alerts/**

spring.cloud.gateway.routes[8].id=dashboard-service
spring.cloud.gateway.routes[8].uri=lb://dashboard-service
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/dashboard/**
