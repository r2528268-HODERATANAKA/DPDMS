# Self-hosted WhatsApp gateway (Evolution API v2) so DPDMS can send real WhatsApp
# messages WITHOUT a WhatsApp Business Account (school-project friendly).
#
#   cd whatsapp-gateway && docker compose up -d
#   API:     http://localhost:18090
#   Manager: http://localhost:18090/manager   (API key: dpdms-evolution-key)
#
# The owner scans the QR once with their own WhatsApp (Linked Devices). After that,
# alert-service can POST to it (provider=local_gateway).
services:
  evolution-postgres:
    image: postgres:15-alpine
    container_name: dpdms-evolution-pg
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution
    volumes:
      - evolution_pg:/var/lib/postgresql/data

  evolution-redis:
    image: redis:7-alpine
    container_name: dpdms-evolution-redis

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: dpdms-evolution-api
    ports:
      - "18090:8080"
    environment:
      AUTHENTICATION_API_KEY: dpdms-evolution-key
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@evolution-postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      CONFIG_SESSION_PHONE_CLIENT: DPDMS
      CONFIG_SESSION_PHONE_NAME: Chrome
      QRCODE_LIMIT: "60"
      WEBHOOK_GLOBAL_ENABLED: "false"
      DEL_INSTANCE: "false"
    depends_on:
      - evolution-postgres
      - evolution-redis

volumes:
  evolution_pg:
