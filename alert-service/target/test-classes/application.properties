# Test-only configuration (in-memory H2, notifications all off)
spring.application.name=alert-service
server.port=0

spring.datasource.url=jdbc:h2:mem:alert_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

alert.email.enabled=false
# host must be set so MailSenderAutoConfiguration creates the JavaMailSender bean
# (it is never actually contacted because alert.email.enabled=false = mock mode)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
alert.whatsapp.provider=mock
alert.telegram.bot-token=
alert.recipients.email=
alert.recipients.whatsapp=
alert.recipients.telegram=
