spring.application.name=alert-service
server.port=8087

spring.datasource.url=jdbc:mysql://localhost:3306/dpdms_alert?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Gr@nd$0n

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- EMAIL ----------
# false = MOCK mode (nothing sent, log rows still written - perfect for the demo).
# true  = real SMTP. For Gmail: create an App Password, then
#         username=<your gmail>, password=<16-char app password>.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
alert.email.enabled=false
alert.email.from=dpdms-alerts@example.com

# ---------- WHATSAPP ----------
# provider=mock (default, nothing sent) | provider=meta (WhatsApp Cloud API)
# For Meta: developer.facebook.com -> create app -> WhatsApp -> copy the
# phone number id + temporary access token into the two keys below.
alert.whatsapp.provider=mock
alert.whatsapp.api-url=https://graph.facebook.com/v21.0
alert.whatsapp.phone-number-id=
alert.whatsapp.token=

# ---------- TELEGRAM ----------
# Free and quickest to demo live: @BotFather -> /newbot -> paste the token here.
alert.telegram.bot-token=
alert.telegram.api-url=https://api.telegram.org

# ---------- WHO receives alerts (comma separated) ----------
# Fill these in and the mock/real channels have somewhere to send.
alert.recipients.email=
alert.recipients.whatsapp=
alert.recipients.telegram=

# ---------- Where the hazard services live (approved feeds) ----------
hazard.flood.url=http://localhost:8081
hazard.drought.url=http://localhost:8082
hazard.fire.url=http://localhost:8083
hazard.zoonotic.url=http://localhost:8084
hazard.mining.url=http://localhost:8085
